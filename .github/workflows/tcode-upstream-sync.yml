name: Tcode / Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: tcode-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout product branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure remotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/eclipse-theia/theia.git
          git fetch --prune origin master
          git fetch --prune upstream master
          git fetch origin upstream-master:refs/remotes/origin/upstream-master || true
      - name: Publish upstream mirror
        run: |
          git push --force-with-lease=refs/heads/upstream-master origin upstream/master:refs/heads/upstream-master
      - name: Stop when upstream has not changed
        id: delta
        run: |
          previous=''
          if git show-ref --verify --quiet refs/remotes/origin/upstream-master; then
            previous="$(git rev-parse refs/remotes/origin/upstream-master)"
          fi
          current="$(git rev-parse refs/remotes/upstream/master)"
          if [ -n "$previous" ] && [ "$previous" = "$current" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Merge upstream into a sync branch
        if: steps.delta.outputs.changed == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch --create bot/upstream-sync origin/master
          if ! git merge --no-edit --no-ff refs/remotes/upstream/master; then
            git merge --abort || true
            gh label create upstream-conflict --color B60205 --description 'Upstream merge needs manual resolution' --force || true
            issue="$(gh issue list --state open --search '"'"'upstream sync conflict'"'"' in:title' --json number --jq '.[0].number')"
            body='The scheduled upstream merge could not be completed automatically. Resolve the conflict on `bot/upstream-sync`, run the downstream verification checks, and close this issue after the sync PR is merged.'
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title 'upstream sync conflict' --label upstream-conflict --body "$body"
            fi
            exit 1
          fi
          if git diff --quiet origin/master HEAD; then
            echo 'Upstream advanced, but the product tree is already current; no sync PR is needed.'
            exit 0
          fi
          git fetch origin bot/upstream-sync:refs/remotes/origin/bot/upstream-sync || true
          git push --force-with-lease=refs/heads/bot/upstream-sync origin HEAD:refs/heads/bot/upstream-sync
      - name: Create or update the sync pull request
        if: steps.delta.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --state open --head bot/upstream-sync --base master --json number --jq '.[0].number')"
          body='This PR merges the latest `eclipse-theia/theia:master` into Tcode. It is intentionally not auto-merged; review the downstream diff and wait for CI before merging.'
          if [ -z "$pr" ]; then
            gh pr create --base master --head bot/upstream-sync --title 'chore: sync eclipse-theia/theia master' --body "$body"
          else
            gh pr comment "$pr" --body 'The sync branch has been refreshed with the latest upstream master.'
          fi
