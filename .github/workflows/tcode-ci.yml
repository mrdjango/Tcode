name: Tcode / Verify

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify downstream package
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js 24.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile Tcode extension and application
        run: |
          npm run compile --workspace @tcode/tensorgrid-ai
          npm run compile --workspace @tcode/electron-app
      - name: Lint Tcode extension
        run: npm run lint --workspace @tcode/tensorgrid-ai
      - name: Test Tcode extension
        run: npm run test --workspace @tcode/tensorgrid-ai
